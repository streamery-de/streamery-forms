name: Build release package

# Produces the distributable plugin zip.
#
# This exists because vendor/ and assets/blocks/ are build output and are not in
# version control -- a plain `git archive` of this repository is not a working
# plugin. The zip is assembled from a full build, with .distignore deciding what
# is excluded.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build admin app and blocks
        run: npm run build

      - name: Verify the build produced what the plugin needs at runtime
        run: |
          test -f vendor/autoload.php || { echo "::error::vendor/autoload.php missing"; exit 1; }
          test -d assets/blocks || { echo "::error::assets/blocks/ missing"; exit 1; }
          test -f assets/blocks/form/block.json || { echo "::error::blocks were not built"; exit 1; }

      - name: Create distribution archive
        run: |
          composer global require wp-cli/dist-archive-command
          "$(composer config -g home)/vendor/bin/wp" dist-archive . ./streamery-forms.zip --plugin-dirname=streamery-forms

      # actions/upload-artifact always wraps whatever `path` points to in its
      # own zip when downloaded from the Actions UI. Uploading the .zip file
      # directly used to give users a zip-of-a-zip (WordPress found no plugin
      # inside). Unpacking it first so `dist/streamery-forms/` is uploaded
      # means the one zip GitHub produces on download IS the plugin package.
      - name: Unpack archive for artifact upload
        run: |
          mkdir dist
          unzip -q streamery-forms.zip -d dist
          test -f dist/streamery-forms/streamery-forms.php || { echo "::error::plugin bootstrap file missing from archive"; exit 1; }
          test -f dist/streamery-forms/vendor/autoload.php || { echo "::error::vendor/autoload.php missing from archive"; exit 1; }
          test -f dist/streamery-forms/vendor/prappo/wp-eloquent/src/Support/helpers.php || { echo "::error::vendor/prappo/wp-eloquent/src missing from archive (check .distignore anchoring)"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamery-forms
          path: dist

  # Publishing to the WordPress.org SVN repository. Only runs on a tag, and only
  # once the repository secrets exist -- so it stays inert until the plugin has
  # actually been approved and SVN credentials are available.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install PHP dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build admin app and blocks
        run: npm run build

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: streamery-forms
          # Banners/icons/screenshots go to SVN /assets/, not into the plugin.
          ASSETS_DIR: .wordpress-org
